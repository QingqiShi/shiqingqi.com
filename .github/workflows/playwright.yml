name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.affected.outputs.web }}
      finance: ${{ steps.affected.outputs.finance }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Find affected apps
        id: affected
        # On a pull request, HEAD is the merge commit, so HEAD^1 is the base
        # branch. turbo marks an app as affected when the app or a package it
        # uses changes. turbo does not mark the apps for most files outside
        # apps and packages, such as this workflow or the scripts that the
        # Playwright configs use. Thus a change to such a file tests all apps.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "finance=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          turbo=$(node -p 'require("./package.json").devDependencies.turbo')
          affected=$(TURBO_SCM_BASE=HEAD^1 TURBO_SCM_HEAD=HEAD pnpm dlx "turbo@$turbo" ls --affected --output=json \
            | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(d.packages.items.map((p)=>p.name).join(" "))')
          echo "turbo affected: $affected"
          outside=$(git diff --name-only HEAD^1 HEAD -- . ':!apps' ':!packages')
          echo "Changed outside apps and packages: ${outside:-none}"
          for app in web finance; do
            if [ -n "$outside" ] || [[ " $affected " == *" $app "* ]]; then
              echo "$app=true" | tee -a "$GITHUB_OUTPUT"
            else
              echo "$app=false" | tee -a "$GITHUB_OUTPUT"
            fi
          done

  # Build the web app once and share the output with every test shard, instead
  # of rebuilding it inside each shard's Playwright webServer.
  build:
    needs: [changes]
    if: ${{ needs.changes.outputs.web != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app
        working-directory: apps/web
        run: pnpm build
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          # NEXT_PUBLIC_* values are inlined into the client bundle at build
          # time, so playwright.config.ts's webServer env alone can't exercise
          # posthog.init() on CI — the build step needs the same placeholders.
          # The host is deliberately unresolvable so init sends nothing.
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: "phc_e2e_placeholder"
          NEXT_PUBLIC_POSTHOG_HOST: "https://posthog.invalid"
          NEXT_PUBLIC_UI_DEV_CHECKS: "1"
      # `.next/node_modules` holds relative symlinks to externalised packages
      # such as sharp. upload-artifact copies a symlink as a bare directory, so
      # sharp would lose its own dependencies; a tar file keeps the links.
      - name: Pack build output
        # `next start` serves from `.next`; `public` carries the generated
        # service worker and hashed PWA icons. `.next/cache` is build-only, so
        # excluding it keeps the artifact small and the shard download fast.
        run: tar --exclude=apps/web/.next/cache -cf web-build.tar apps/web/.next apps/web/public
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web-build.tar
          include-hidden-files: true
          retention-days: 1

  test:
    # Deliberately NO `needs: [build]`. Shards start at the same time as the
    # build job and run their own setup (container pull, checkout, install)
    # *while* the app builds, then wait for the build artifact below. Overlapping
    # shard setup with the build removes the serial "build gate" without going
    # back to rebuilding the app inside every shard.
    needs: [changes]
    if: ${{ needs.changes.outputs.web != 'false' }}
    permissions:
      contents: read
      # Needed to poll the run's artifacts/jobs API while waiting for the build.
      actions: read
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Keep the Playwright container: its browser and system libraries are
    # pre-baked, so shards never run `playwright install --with-deps` — whose
    # apt step intermittently hangs for hours on the runner's dpkg lock
    # (actions/runner-images#11347). The image pull overlaps with the build job
    # (see above), so it stays off the critical path.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7]
        shardTotal: [7]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Wait for the build job to publish the web-build artifact. Artifacts v4 are
      # downloadable via the API the instant the upload finishes — mid-run — so we
      # poll for it here rather than gating the whole job on `needs: [build]`. Bail
      # out early if the build job fails so a broken build fails fast instead of
      # hanging until the timeout. Uses curl + node rather than `gh` because the
      # Playwright container image does not ship the GitHub CLI.
      - name: Wait for prebuilt web app
        # The container's default shell is `sh` (dash), which rejects
        # `set -o pipefail`; force bash, which the Playwright image ships.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          auth="Authorization: Bearer $GH_TOKEN"
          accept="Accept: application/vnd.github+json"
          for _ in $(seq 1 60); do
            if curl -sf -H "$auth" -H "$accept" "$run/artifacts" \
                 | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));process.exit((d.artifacts||[]).some((a)=>a.name==="web-build")?0:1)'; then
              echo "Build artifact is ready."
              exit 0
            fi
            conclusion=$(curl -sf -H "$auth" -H "$accept" "$run/jobs" \
                 | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));const b=(d.jobs||[]).find((j)=>j.name==="build");process.stdout.write((b&&b.conclusion)||"")' || true)
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "Build job $conclusion — aborting shard." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for the build artifact." >&2
          exit 1
      - name: Download prebuilt web app
        uses: actions/download-artifact@v8
        with:
          name: web-build
      - name: Unpack prebuilt web app
        run: tar -xf web-build.tar
      - name: Run Playwright tests
        working-directory: apps/web
        # webServer runs `pnpm start` on CI (see playwright.config.ts); the app is
        # already built by the `build` job above.
        run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: apps/web/blob-report
          retention-days: 1

  # Branch protection requires each shard check by its name. A matrix job that
  # its `if` skips gives one check without the matrix values, so this job gives
  # the shard checks when the change does not reach the app. Keep its matrix
  # the same as the matrix of `test`.
  test-skipped:
    name: test
    needs: [changes]
    if: ${{ needs.changes.outputs.web == 'false' }}
    permissions: {}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7]
        shardTotal: [7]
    steps:
      - run: echo "This change does not reach the web app."

  merge-reports:
    permissions:
      contents: read
    # Only build the HTML report when a shard actually failed. With
    # `trace: on-first-retry`, a fully green run's report carries no
    # traces/screenshots/video — just a list of passing test names — so generating
    # it spends ~30s of pnpm/node/install bootstrap on the critical path to produce
    # an artifact nobody opens. On failure the report is built as before (that's
    # when traces exist). Per-shard blob reports are still uploaded with 1-day
    # retention, so a report can be reconstructed by re-running this job if needed.
    # This job is not a required status check, so skipping it on green blocks
    # nothing.
    if: ${{ needs.test.result == 'failure' }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML Report
        working-directory: apps/web
        run: pnpm exec playwright merge-reports --reporter html ../../all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 30

  finance-build:
    needs: [changes]
    if: ${{ needs.changes.outputs.finance != 'false' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build finance app
        working-directory: apps/finance
        run: pnpm build
        env:
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: "phc_e2e_placeholder"
          NEXT_PUBLIC_POSTHOG_HOST: "https://posthog.invalid"
          NEXT_PUBLIC_UI_DEV_CHECKS: "1"
      - name: Pack build output
        run: tar --exclude=apps/finance/.next/cache -cf finance-build.tar apps/finance/.next apps/finance/public
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: finance-build
          path: finance-build.tar
          include-hidden-files: true
          retention-days: 1

  finance-test:
    needs: [changes]
    if: ${{ needs.changes.outputs.finance != 'false' }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Wait for prebuilt finance app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          auth="Authorization: Bearer $GH_TOKEN"
          accept="Accept: application/vnd.github+json"
          for _ in $(seq 1 60); do
            if curl -sf -H "$auth" -H "$accept" "$run/artifacts" \
                 | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));process.exit((d.artifacts||[]).some((a)=>a.name==="finance-build")?0:1)'; then
              echo "Build artifact is ready."
              exit 0
            fi
            conclusion=$(curl -sf -H "$auth" -H "$accept" "$run/jobs" \
                 | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));const b=(d.jobs||[]).find((j)=>j.name==="finance-build");process.stdout.write((b&&b.conclusion)||"")' || true)
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "Build job $conclusion — aborting shard." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for the build artifact." >&2
          exit 1
      - name: Download prebuilt finance app
        uses: actions/download-artifact@v8
        with:
          name: finance-build
      - name: Unpack prebuilt finance app
        run: tar -xf finance-build.tar
      - name: Run Playwright tests
        working-directory: apps/finance
        run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: finance-blob-report-${{ matrix.shardIndex }}
          path: apps/finance/blob-report
          retention-days: 1

  # Gives the required shard checks when the change does not reach Finance. See
  # `test-skipped`.
  finance-test-skipped:
    name: finance-test
    needs: [changes]
    if: ${{ needs.changes.outputs.finance == 'false' }}
    permissions: {}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      - run: echo "This change does not reach Finance."

  finance-merge-reports:
    permissions:
      contents: read
    if: ${{ needs.finance-test.result == 'failure' }}
    needs: [finance-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@v8
        with:
          path: finance-blob-reports
          pattern: finance-blob-report-*
          merge-multiple: true
      - name: Merge into HTML Report
        working-directory: apps/finance
        run: pnpm exec playwright merge-reports --reporter html ../../finance-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: finance-playwright-report
          path: apps/finance/playwright-report
          retention-days: 30
