# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"
    # Wait until a version has aged before opening a PR, so it has cleared
    # pnpm 11's default 24h `minimumReleaseAge` supply-chain gate by the time
    # CI runs `pnpm install`. Cooldown applies to version updates only —
    # security updates still flow immediately.
    cooldown:
      default-days: 3
      semver-major-days: 7
    assignees:
      - "QingqiShi"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    # The component playground runs Babel 7 because `@stylexjs/babel-plugin`
    # needs it. Remove these entries when StyleX supports Babel 8.
    ignore:
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/plugin-transform-modules-commonjs"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/eslint-plugin-next"
      eslint:
        patterns:
          - "eslint"
          - "@eslint*"
          - "typescript-eslint"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-compiler:
        patterns:
          - "eslint-plugin-react-compiler"
          - "babel-plugin-react-compiler"
      serwist:
        patterns:
          - "@serwist*"
          - "serwist"
      stylex:
        patterns:
          - "@stylex*"
      babel:
        patterns:
          - "@babel*"
          - "@types/babel__*"
      testing-library:
        patterns:
          - "@testing-library*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest*"
          - "@vitejs/plugin-react"
          - "vite-plugin-babel"
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk*"
      postcss:
        patterns:
          - "postcss-*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "15:00"
    assignees:
      - "QingqiShi"
    open-pull-requests-limit: 10
