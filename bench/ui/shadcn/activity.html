<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
              secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))" },
              muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
              accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
              destructive: "hsl(var(--destructive))",
              card: "hsl(var(--card))",
              sidebar: "hsl(var(--sidebar))",
            },
            borderRadius: { xl: "calc(var(--radius) + 4px)", lg: "var(--radius)", md: "calc(var(--radius) - 2px)" },
          },
        },
      };
    </script>
    <style>
      :root {
        --background: 0 0% 100%; --foreground: 0 0% 3.9%; --card: 0 0% 100%;
        --primary: 0 0% 9%; --primary-foreground: 0 0% 98%;
        --secondary: 0 0% 96.1%; --secondary-foreground: 0 0% 9%;
        --muted: 0 0% 96.1%; --muted-foreground: 0 0% 45.1%;
        --accent: 0 0% 96.1%; --accent-foreground: 0 0% 9%;
        --destructive: 0 84.2% 60.2%; --border: 0 0% 89.8%; --input: 0 0% 89.8%;
        --sidebar: 0 0% 98%; --radius: 0.625rem;
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside class="hidden w-64 shrink-0 flex-col border-r bg-sidebar md:flex">
        <div class="flex items-center gap-2 p-4">
          <div class="flex size-8 items-center justify-center rounded-lg bg-primary text-primary-foreground"><i data-lucide="mail-check" class="size-4"></i></div>
          <div class="grid text-sm leading-tight"><span class="font-semibold">Assistant</span><span class="text-xs text-muted-foreground">2 mailboxes</span></div>
        </div>
        <div class="px-2">
          <nav class="flex flex-col gap-1">
            <a class="flex h-8 items-center gap-2 rounded-md px-2 text-sm"><i data-lucide="sun" class="size-4"></i>Today</a>
            <a class="flex h-8 items-center gap-2 rounded-md px-2 text-sm"><i data-lucide="square-check" class="size-4"></i>To-dos<span class="ml-auto text-xs tabular-nums text-muted-foreground">17</span></a>
            <a class="flex h-8 items-center gap-2 rounded-md bg-accent px-2 text-sm font-medium"><i data-lucide="history" class="size-4"></i>Activity</a>
            <a class="flex h-8 items-center gap-2 rounded-md px-2 text-sm"><i data-lucide="settings" class="size-4"></i>Settings</a>
          </nav>
        </div>
      </aside>

      <!-- Main -->
      <div class="flex min-w-0 flex-1 flex-col">
        <header class="sticky top-0 z-10 flex h-14 items-center gap-2 border-b bg-background px-4 md:static md:bg-transparent">
          <button class="flex size-7 items-center justify-center rounded-md hover:bg-accent"><i data-lucide="panel-left" class="size-4"></i></button>
          <div class="mx-2 h-4 w-px bg-border"></div>
          <nav class="flex items-center gap-1.5 text-sm"><span class="hidden text-muted-foreground md:inline">Assistant</span><i data-lucide="chevron-right" class="hidden size-3.5 text-muted-foreground md:block"></i><span class="font-medium">Activity</span></nav>
        </header>

        <main class="mx-auto flex w-full max-w-4xl flex-col gap-6 p-4 md:p-6">
          <div class="flex flex-col gap-1">
            <h1 class="text-2xl font-semibold tracking-tight">Activity</h1>
            <p class="text-sm text-muted-foreground">Everything the assistant did on its own. Undo anything with one click.</p>
          </div>

          <!-- Summary -->
          <div class="rounded-xl border bg-card shadow-sm">
            <div class="flex flex-col gap-1.5 p-4 pb-0 md:p-6 md:pb-0"><h3 class="font-semibold leading-none tracking-tight">Last 7 days</h3><p class="text-sm text-muted-foreground">212 mails handled</p></div>
            <div class="grid grid-cols-2 gap-4 p-4 sm:grid-cols-4 md:p-6">
              <div class="space-y-1"><p class="text-sm text-muted-foreground">Filed</p><p class="text-2xl font-bold tabular-nums">148</p></div>
              <div class="space-y-1"><p class="text-sm text-muted-foreground">Archived</p><p class="text-2xl font-bold tabular-nums">41</p></div>
              <div class="space-y-1"><p class="text-sm text-muted-foreground">Moved to Junk</p><p class="text-2xl font-bold tabular-nums">19</p></div>
              <div class="space-y-1"><p class="text-sm text-muted-foreground">Undone by you</p><p class="text-2xl font-bold tabular-nums">4</p></div>
            </div>
          </div>

          <!-- Filter -->
          <button role="combobox" class="flex h-9 w-full items-center justify-between whitespace-nowrap rounded-md border border-input bg-transparent px-3 py-2 text-sm shadow-sm sm:hidden"><span class="flex items-center gap-2"><i data-lucide="list-filter" class="size-4 text-muted-foreground"></i>All activity</span><span class="flex items-center gap-2"><span class="inline-flex items-center rounded-md border border-transparent bg-destructive px-2 py-0.5 text-xs font-semibold text-white">1 problem</span><i data-lucide="chevron-down" class="size-4 opacity-50"></i></span></button>
          <div class="hidden sm:block">
            <div role="tablist" class="inline-flex h-9 items-center justify-center rounded-lg bg-muted p-1 text-muted-foreground">
              <button role="tab" data-state="active" class="inline-flex items-center justify-center whitespace-nowrap rounded-md bg-background px-3 py-1 text-sm font-medium text-foreground shadow transition-all">All</button>
              <button role="tab" class="inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all">Filed</button>
              <button role="tab" class="inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all">Archived</button>
              <button role="tab" class="inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all">Junk</button>
              <button role="tab" class="inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all">Drafts</button>
              <button role="tab" class="inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all">Problems<span class="inline-flex h-4 min-w-4 items-center justify-center rounded-full bg-destructive px-1 text-[10px] font-semibold text-white">1</span></button>
            </div>
          </div>

          <div id="days" class="flex flex-col gap-6"></div>

          <div class="flex flex-col items-center justify-between gap-3 sm:flex-row">
            <p class="text-sm text-muted-foreground">Showing 8 of 212 entries</p>
            <button class="inline-flex h-9 w-full items-center justify-center gap-2 rounded-md border border-input bg-background px-4 py-2 text-sm font-medium shadow-sm hover:bg-accent sm:w-auto">Load older</button>
          </div>
        </main>
      </div>
    </div>
    <script>
      const btn = (icon, label) =>
        `<button class="inline-flex h-8 items-center justify-center gap-2 rounded-md border border-input bg-background px-3 text-xs font-medium shadow-sm hover:bg-accent"><i data-lucide="${icon}" class="size-3.5"></i>${label}</button>`;
      const ghost = (icon, label) =>
        `<button class="inline-flex h-8 items-center justify-center gap-2 rounded-md px-3 text-xs font-medium hover:bg-accent hover:text-accent-foreground"><i data-lucide="${icon}" class="size-3.5"></i>${label}</button>`;
      const mailbox = (m) =>
        `<span class="inline-flex items-center rounded-md border px-2 py-0.5 text-xs font-semibold text-foreground">${m}</span>`;

      const days = [
        {
          title: "Today", date: "Tuesday 10 November",
          entries: [
            { time: "09:31", icon: "folder-input", text: 'Filed <span class="font-medium">“Your receipt from Waterstones”</span> into Finance/Receipts', reason: "An order receipt with a total.", box: "Gmail", actions: [btn("undo-2", "Undo")] },
            { time: "09:30", icon: "archive", text: "Archived 6 newsletters older than 7 days", reason: "Your rule “Archive newsletters after 7 days”.", box: "Gmail", actions: [ghost("eye", "Show 6 mails"), btn("undo-2", "Undo")] },
            { time: "08:02", icon: "pen-line", text: "Drafted a reply to Priya at Foxtons about the gas safety check", reason: "You asked to follow up on 13 Nov, and she wrote first.", box: "Gmail", actions: [btn("external-link", "Open draft")] },
            { time: "07:30", icon: "send", text: "Sent the morning report", box: "Gmail", muted: true },
          ],
        },
        {
          title: "Yesterday", date: "Monday 9 November",
          entries: [
            { time: "18:44", icon: "shield-alert", text: 'Moved <span class="font-medium">“You have won a £500 gift card”</span> to Junk', reason: "Sender not seen before, prize wording.", box: "Outlook", failed: true },
            { time: "14:10", icon: "folder-input", text: 'Filed <span class="font-medium">“Octopus Energy: your November bill”</span> into Finance/Bills and added the to-do “Check the Octopus bill (£112.00)”', reason: "A bill with an amount and a due date.", box: "Gmail", actions: [btn("undo-2", "Undo")] },
            { time: "11:05", icon: "rotate-ccw", text: 'Undone by you: <span class="font-medium">“Lumen Q4 brand review”</span> was moved back from Archive to the inbox', undone: true },
            { time: "07:30", icon: "send", text: "Sent the morning report", box: "Gmail", muted: true },
          ],
        },
      ];

      const entry = (e) => `
        <div class="flex gap-3 px-4 py-4 md:gap-4 md:px-6">
          <div class="w-11 shrink-0 pt-0.5 text-sm tabular-nums text-muted-foreground">${e.time}</div>
          <div class="flex size-8 shrink-0 items-center justify-center rounded-full ${e.failed ? "bg-red-50 text-destructive" : "bg-muted text-muted-foreground"} max-sm:hidden"><i data-lucide="${e.icon}" class="size-4"></i></div>
          <div class="min-w-0 flex-1 space-y-1.5">
            <p class="text-sm leading-snug ${e.muted || e.undone ? "text-muted-foreground" : ""}">${e.text}</p>
            ${e.reason ? `<p class="text-sm text-muted-foreground"><span class="font-medium text-foreground/80">Why:</span> ${e.reason}</p>` : ""}
            ${e.box || e.undone ? `<div class="flex flex-wrap items-center gap-2">${e.box ? mailbox(e.box) : ""}${e.undone ? '<span class="inline-flex items-center rounded-md border border-transparent bg-secondary px-2 py-0.5 text-xs font-semibold text-secondary-foreground">Undone</span>' : ""}</div>` : ""}
            ${e.failed ? `
              <div role="alert" class="relative mt-2 w-full rounded-lg border border-destructive/50 px-4 py-3 text-sm text-destructive">
                <div class="flex gap-3"><i data-lucide="circle-alert" class="mt-0.5 size-4 shrink-0"></i><div class="space-y-2"><h5 class="font-medium leading-none tracking-tight">Undo failed</h5><p class="text-sm">Outlook’s sign-in expired on 7 Nov, so the mail could not be moved back.</p>
                <button class="inline-flex h-8 items-center justify-center gap-2 rounded-md border border-input bg-background px-3 text-xs font-medium text-foreground shadow-sm hover:bg-accent"><i data-lucide="refresh-cw" class="size-3.5"></i>Reconnect Outlook</button></div></div>
              </div>` : ""}
            ${e.actions ? `<div class="flex flex-wrap items-center gap-2 pt-1 sm:hidden">${e.actions.join("")}</div>` : ""}
          </div>
          ${e.actions ? `<div class="hidden shrink-0 items-start gap-2 sm:flex">${e.actions.join("")}</div>` : ""}
        </div>`;

      document.getElementById("days").innerHTML = days
        .map((d) => `
          <section class="rounded-xl border bg-card shadow-sm">
            <div class="flex items-baseline gap-2 border-b px-4 py-3 md:px-6"><h3 class="font-semibold leading-none tracking-tight">${d.title}</h3><span class="text-sm text-muted-foreground">${d.date}</span></div>
            <div class="divide-y">${d.entries.map(entry).join("")}</div>
          </section>`)
        .join("");
      lucide.createIcons();
    </script>
  </body>
</html>
